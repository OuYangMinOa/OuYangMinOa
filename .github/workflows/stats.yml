name: Generate Stats
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: OuYangMinOa
          filename: metrics.svg
          base: header, activity, repositories, metadata
          config_timezone: Asia/Taipei
